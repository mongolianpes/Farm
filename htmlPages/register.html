<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .main-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 75px);
        }

        .container {
            background: #fff;
            padding: 35px 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }

        h2 { 
            text-align: center; 
            margin-bottom: 25px;
            color: #333;
        }

        .error { 
            color: red; 
            text-align: center; 
            margin: 12px 0;
        }

        input[type="text"], 
        input[type="password"], 
        input[type="file"] {
            width: 100%;
            padding: 12px 14px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 16px;
        }

        input[type="password"] {
            letter-spacing: 1px;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #007BFF;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 15px;
            font-weight: 500;
        }

        button:hover { 
            background: #0056b3; 
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        .avatar-preview {
            display: flex;
            justify-content: center;
            margin: 10px 0;
        }

        .avatar-preview img {
            max-width: 120px;
            max-height: 120px;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(0,0,0,0.2);
        }
    </style>
    
    <link rel="stylesheet" href="/static/header.css">
</head>
<body>
    {{template "header"}}
    <div class="main-content">
        <div class="container">
            <h2>Регистрация</h2>

            <form action="/register" method="post" enctype="multipart/form-data">
                <input type="text" name="login" placeholder="Логин" value="{{.Login}}" required>
                <input type="text" name="name" placeholder="Имя" value="{{.Name}}" required>
                <input type="password" name="password" placeholder="Пароль" value="{{.Password}}" required>
                <input type="text" name="interests" placeholder="Опишите, что вы хотите видеть" value="{{.Interests}}" required>

                <!-- Загрузка аватара -->
                <input type="file" name="avatar" accept="image/*">
                <div class="avatar-preview">
                    {{if .Avatar}}
                        <img src="{{.Avatar}}" alt="Ваш аватар">
                    {{end}}
                </div>

                <button type="submit">Зарегистрироваться</button>
            </form>


            <p>
                Уже есть аккаунт? <a href="/auth">Авторизация</a>
            </p>
            
            <div class="error" id="reg-error">
                {{if .Error}}
                  <p>{{.Error}}</p>
                {{end}}
            </div>
        </div>
    </div>
</body>
</html>
